<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser</title>
    <style>
      :root { color-scheme: light; font: 16px system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #f5f7fb; color: #1d2433; }
      main { max-width: 720px; margin: 18vh auto; padding: 2rem; text-align: center; }
      .shell { border: 1px solid #dbe1ea; border-radius: 1.25rem; padding: 3rem; background: rgba(255,255,255,.72); box-shadow: 0 1rem 3rem rgba(46,58,80,.08); }
      p { color: #647086; }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="title">
        <h1 id="title">Browser shell</h1>
        <p>Local Tauri window bootstrap. Web navigation is intentionally not enabled in this milestone.</p>
      </section>
    </main>
  </body>
</html>
