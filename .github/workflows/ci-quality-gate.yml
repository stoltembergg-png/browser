name: CI / Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install Tauri Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev

      - name: Verify locked metadata
        run: cargo metadata --locked --format-version 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build rustdoc
        run: cargo doc --workspace --no-deps --locked

      - name: Check documentation authority
        run: python3 scripts/documentation_check.py

      - name: Check documentation tests
        run: python3 -m unittest -v tests/test_documentation_check.py

      - name: Run security baseline tests
        run: python3 -m unittest -v tests/test_security_check.py

      - name: Check security baseline
        run: python3 scripts/security_check.py

      - name: Run threat regression gate tests
        run: python3 tests/test_threat_regression_gate.py

      - name: Validate threat regression manifest
        run: python3 scripts/threat_regression_gate.py --validate-only

      - name: Check architecture graph
        run: cargo run -p xtask --locked -- architecture-check

      - name: Run MVP smoke harness
        run: cargo run -p xtask --locked -- smoke

      - name: Check quality-gate evidence manifest
        run: python3 scripts/quality_gate_check.py

      - name: Check quality-gate manifest tests
        run: python3 -m unittest -v tests/test_quality_gate_check.py

      - name: Run shell bootstrap acceptance tests
        run: python3 -m unittest -v tests/test_shell_bootstrap.py

      - name: Run shell contract acceptance tests
        run: python3 -m unittest -v tests/test_shell_contract.py

      - name: Run release manifest tests
        run: python3 -m unittest -v tests/test_release_manifest.py

  # Cross-platform matrix: run core crate tests on Windows and macOS
  # to verify the engine-api, browser-domain, and servo-engine compile
  # and pass on all three target platforms.
  #
  # The full quality gate (including Tauri/browser-desktop) remains
  # Linux-only because it requires libwebkit2gtk-4.1-dev system deps.
  # The matrix validates cross-platform crate compatibility without
  # the webview dependency.
  os-matrix:
    name: OS Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify locked metadata (core crates)
        run: cargo metadata --locked --format-version 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check core crates
        run: cargo check -p browser-domain -p engine-api -p servo-engine --locked

      - name: Run core crate tests
        run: cargo test -p browser-domain -p engine-api -p servo-engine --locked

      - name: Run Clippy on core crates
        run: cargo clippy -p browser-domain -p engine-api -p servo-engine --all-targets --locked -- -D warnings

  # Gate job: requires both quality and os-matrix to pass.
  # A failure on any OS does NOT become a pass.
  quality-gate-aggregate:
    name: Quality Gate (aggregate)
    runs-on: ubuntu-24.04
    needs: [quality, os-matrix]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check gate status
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "os-matrix: ${{ needs.os-matrix.result }}"
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "::error::Quality Gate failed"
            exit 1
          fi
          if [ "${{ needs.os-matrix.result }}" != "success" ]; then
            echo "::error::OS Matrix failed — a runner failure is NOT a pass"
            exit 1
          fi
          echo "All gates passed"
