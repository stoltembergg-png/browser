name: CI / Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: CI / Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install Tauri Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev

      - name: Verify locked metadata
        run: cargo metadata --locked --format-version 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build rustdoc
        run: cargo doc --workspace --no-deps --locked

      - name: Check documentation authority
        run: python3 scripts/documentation_check.py

      - name: Check documentation tests
        run: python3 -m unittest -v tests/test_documentation_check.py

      - name: Run security baseline tests
        run: python3 -m unittest -v tests/test_security_check.py

      - name: Check security baseline
        run: python3 scripts/security_check.py

      - name: Run threat regression gate tests
        run: python3 tests/test_threat_regression_gate.py

      - name: Validate threat regression manifest
        run: python3 scripts/threat_regression_gate.py --validate-only

      - name: Check architecture graph
        run: cargo run -p xtask --locked -- architecture-check

      - name: Run MVP smoke harness
        run: cargo run -p xtask --locked -- smoke

      - name: Check quality-gate evidence manifest
        run: python3 scripts/quality_gate_check.py

      - name: Check quality-gate manifest tests
        run: python3 -m unittest -v tests/test_quality_gate_check.py

      - name: Run shell bootstrap acceptance tests
        run: python3 -m unittest -v tests/test_shell_bootstrap.py

      - name: Run shell contract acceptance tests
        run: python3 -m unittest -v tests/test_shell_contract.py

      - name: Run release manifest tests
        run: python3 -m unittest -v tests/test_release_manifest.py

      - name: Run offline WPT harness contract tests
        run: python3 tests/test_wpt_runner.py -v

  servo-real:
    name: PR-026 real Servo contract
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/pr-026-servo-surface')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install Servo rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang lld llvm libclang-dev libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libssl-dev \
            libudev-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - name: Record PR-026 identity
        run: |
          echo "SERVO_EVIDENCE_REPOSITORY=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "SERVO_EVIDENCE_COMMIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SERVO_EVIDENCE_TREE_SHA=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "SERVO_EVIDENCE_OS_ARCH=$(uname -s)-$(uname -m)" >> "$GITHUB_ENV"
          echo "SERVO_EVIDENCE_ARTIFACT_PATH=${RUNNER_TEMP}/servo-evidence.json" >> "$GITHUB_ENV"

      - name: Run real Servo fixture contract
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/pr026-target" \
            cargo test -p servo-engine --features servo-backend --no-default-features \
              --test real_servo_contract --locked -- --nocapture

      - name: Validate real Servo evidence
        run: python3 scripts/servo_evidence_check.py "$SERVO_EVIDENCE_ARTIFACT_PATH"

      - name: Upload PR-026 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: servo-evidence-${{ github.sha }}
          path: ${{ env.SERVO_EVIDENCE_ARTIFACT_PATH }}
          if-no-files-found: error

  reference-smoke:
    name: PR-029 reference-platform smoke
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/pr-029-reference-platform-smoke')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install Servo rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang lld llvm libclang-dev libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libssl-dev \
            libudev-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - name: Record reference-platform identity
        run: |
          echo "SERVO_EVIDENCE_REPOSITORY=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "SERVO_EVIDENCE_COMMIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SERVO_EVIDENCE_TREE_SHA=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "SERVO_EVIDENCE_OS_ARCH=$(uname -s)-$(uname -m)" >> "$GITHUB_ENV"
          echo "SERVO_EVIDENCE_ARTIFACT_PATH=${RUNNER_TEMP}/servo-evidence.json" >> "$GITHUB_ENV"

      - name: Run real Servo reference contract
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/pr029-target" \
            cargo test -p servo-engine --features servo-backend --no-default-features \
              --test real_servo_contract --locked -- --nocapture

      - name: Validate reference-platform evidence
        run: python3 scripts/servo_evidence_check.py "$SERVO_EVIDENCE_ARTIFACT_PATH"

      - name: Upload reference-platform evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: servo-reference-evidence-${{ github.sha }}
          path: ${{ env.SERVO_EVIDENCE_ARTIFACT_PATH }}
          if-no-files-found: error

  # Cross-platform matrix: run core crate tests on Windows and macOS
  # to verify the engine-api, browser-domain, and servo-engine compile
  # and pass on all three target platforms.
  #
  # The full quality gate (including Tauri/browser-desktop) remains
  # Linux-only because it requires libwebkit2gtk-4.1-dev system deps.
  # The matrix validates cross-platform crate compatibility without
  # the webview dependency.
  os-matrix:
    name: OS Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Configure short Windows Cargo git path
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          New-Item -ItemType Directory -Force -Path C:\cargo | Out-Null
          "CARGO_HOME=C:\cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify locked metadata (core crates)
        run: cargo metadata --locked --format-version 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check core crates
        run: cargo check -p browser-domain -p engine-api -p servo-engine --locked

      - name: Run core crate tests
        run: cargo test -p browser-domain -p engine-api -p servo-engine --locked

      - name: Run Clippy on core crates
        run: cargo clippy -p browser-domain -p engine-api -p servo-engine --all-targets --locked -- -D warnings

  # Gate job: requires both quality and os-matrix to pass.
  # A failure on any OS does NOT become a pass.
  quality-gate-aggregate:
    name: Quality Gate (aggregate)
    runs-on: ubuntu-24.04
    needs: [quality, os-matrix, servo-real, reference-smoke]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check gate status
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "os-matrix: ${{ needs.os-matrix.result }}"
          echo "servo-real: ${{ needs.servo-real.result }}"
          echo "reference-smoke: ${{ needs.reference-smoke.result }}"
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "::error::Quality Gate failed"
            exit 1
          fi
          if [ "${{ needs.os-matrix.result }}" != "success" ]; then
            echo "::error::OS Matrix failed — a runner failure is NOT a pass"
            exit 1
          fi
          if [ "${{ startsWith(github.head_ref, 'feat/pr-026-servo-surface') }}" = "true" ] \
            && [ "${{ needs.servo-real.result }}" != "success" ]; then
            echo "::error::PR-026 real Servo contract failed or was skipped"
            exit 1
          fi
          if [ "${{ startsWith(github.head_ref, 'feat/pr-029-reference-platform-smoke') }}" = "true" ] \
            && [ "${{ needs.reference-smoke.result }}" != "success" ]; then
            echo "::error::PR-029 reference-platform smoke failed or was skipped"
            exit 1
          fi
          echo "All gates passed"
