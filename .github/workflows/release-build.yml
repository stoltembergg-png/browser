name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux Artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build Tauri desktop app
        run: cargo build --release -p browser-desktop
        env:
          RUSTFLAGS: "-Csymbol-mangling-version=v0"

      - name: Compute checksum
        run: |
          BINARY="target/release/browser-desktop"
          if [ ! -f "$BINARY" ]; then
            echo "::error::Binary not found at $BINARY"
            exit 1
          fi
          SHA256=$(sha256sum "$BINARY" | awk '{print $1}')
          SIZE=$(stat -c%s "$BINARY")
          echo "sha256=$SHA256" >> "$GITHUB_ENV"
          echo "size=$SIZE" >> "$GITHUB_ENV"

          # Write checksum file
          sha256sum "$BINARY" | awk '{print $1"  browser-desktop-linux-x86_64_'${{ inputs.version }}'"}' \
            > "browser-desktop-linux-x86_64_${{ inputs.version }}.sha256"

      - name: Generate release manifest
        run: |
          cat > release-manifest.json << EOF
          {
            "version": "${{ inputs.version }}",
            "commit": "${{ github.sha }}",
            "artifacts": [
              {
                "name": "browser-desktop-linux-x86_64",
                "filename": "browser-desktop",
                "sha256": "${{ env.sha256 }}",
                "size": ${{ env.size }},
                "os": "linux",
                "arch": "x86_64"
              }
            ]
          }
          EOF
          cat release-manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-desktop-linux-x86_64-${{ inputs.version }}
          path: |
            target/release/browser-desktop
            browser-desktop-linux-x86_64_${{ inputs.version }}.sha256
            release-manifest.json
          retention-days: 90
