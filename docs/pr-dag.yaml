schema_version: 1
status: proposed
source_of_truth: PR_PLAN.md
generated_from_summary_table: true
validation_command: xtask pr-dag-check

rules:
  one_logical_change_per_pr: true
  dependency_is_contract: true
  dependency_evidence_must_be_current: true
  stale_dependency_evidence: fail
  combined_tree_validation_required_for:
    - engine-api
    - ui-schema
    - storage-schema-and-migrations
    - architecture-graph
    - workflows-and-rulesets
    - CODEOWNERS
    - release-manifest
  rebase_or_base_change_invalidates_downstream: true
  proposed_authority_gate: fail
  authority_gates:
    ADR-003:
      required_before: [PR-016, PR-026]
      required_artifacts: [docs/decisions/ADR-003.md, docs/contracts/engine-contract-manifest.yaml]
      accepted_status: accepted_only
      evidence: [servo_revision_pin, surface_strategy, thread_event_loop_model, real_smoke_artifact]
    ADR-004:
      required_before: [PR-020, PR-021, PR-025, PR-026]
      required_artifacts: [docs/decisions/ADR-004.md, docs/contracts/engine-contract-manifest.yaml]
      accepted_status: accepted_only
      evidence: [engine_contract_revision, shared_fake_real_manifest, unknown_rejection_cases]
    ADR-005:
      required_before: [PR-020, PR-023, PR-025, PR-028, PR-029]
      required_artifacts: [docs/decisions/ADR-005.md, docs/contracts/runtime-lifecycle.md, docs/contracts/runtime-manifest.yaml]
      accepted_status: accepted_only
      evidence: [runtime_manifest, bounded_queue_policy, fairness, reliable_control_admission, fencing, shutdown_barrier]
    runtime-lifecycle-contract:
      required_before: [PR-020, PR-023, PR-025, PR-026, PR-028, PR-029]
      required_artifacts: [docs/contracts/runtime-lifecycle.md, docs/contracts/runtime-manifest.yaml]
      accepted_status: accepted_only
      evidence: [transition_matrix, linearization_rule, interleaving_artifacts, recovery_matrix]
    engine-contract-manifest:
      required_before: [PR-015, PR-016, PR-026]
      required_artifacts: [docs/contracts/engine-contract-manifest.yaml]
      accepted_status: accepted_only
      evidence: [fake_adapter_result, servo_adapter_result, non_vacuity, artifact_identity]
  authority_gate_binding:
    required_fields: [repository, commit_sha, tree_sha, artifact_digest]
    combined_tree_validation: true
    missing_stale_or_mismatched: NO_GO
  authority_gate_failure: NO_GO

